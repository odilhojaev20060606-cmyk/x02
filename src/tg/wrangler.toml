# Cloudflare Workers Builds: every push to main deploys this worker automatically.
# Bindings must stay here, otherwise a deploy would detach the database and the KV store.
name = "x0-wallet"
main = "worker.js"
compatibility_date = "2025-11-01"
workers_dev = true
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "x02-db"
database_id = "782a4542-a60a-4ab0-b3af-9d56ebad70c0"

[[kv_namespaces]]
binding = "WALLET"
id = "3769719f2f0c40dc8e00eacb2b92bd77"

[triggers]
crons = ["7 9 * * *"]
