:root {
  /* X02.0: a page of a squared school notebook. Blue ink for X, red ink for 0, pencil for everything else.
     Layout: menu = logo + two mode cards; game = board left, a margin column of notes right. Single-theme by choice. */
  --paper: #f6f7f2;
  --grid: #cfdcea;
  --grid-strong: #9fb6cf;
  --pen: #2b3a55;
  --ink-x: #1f3fa8;
  --ink-o: #c4362f;
  --marker: #fff09a;
  --marker-target: #bfe3ff;
  --gold: #d99a0b;
  --coin: #e8d59a;
  --coin-edge: #a9853a;
  --pencil: #3a3d44;
  --pencil-soft: #6b707a;
  --font-hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --font-body: "Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(to right, transparent 46px, rgba(196,54,47,.45) 46px, rgba(196,54,47,.45) 48px, transparent 48px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 100% 100%, 22px 22px, 22px 22px;
  color: var(--pencil);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  overflow-x: hidden;
}
.app { max-width: 1100px; margin: 0 auto; padding: 18px 16px 48px 64px; }
button { font-family: inherit; }

/* ---------- screens ---------- */
.screen { display: none; }
.screen.active { display: block; animation: screenIn .45s cubic-bezier(.2,.8,.2,1) both; }
@keyframes screenIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes thump { 0% { transform: scale(1); } 35% { transform: scale(1.045); } 100% { transform: scale(1); } }

/* ---------- buttons ---------- */
.btn {
  font: 500 14px/1 var(--font-body);
  padding: 10px 14px;
  border: 1.5px solid var(--pen);
  border-radius: 3px 8px 4px 9px;
  background: var(--paper);
  color: var(--pen);
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--pen);
  transition: transform .08s, box-shadow .08s, background .15s;
}
.btn:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--pen); }
.btn:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--pen); }
.btn:focus-visible, .opp:focus-visible, .seg:focus-visible { outline: 2px solid var(--ink-x); outline-offset: 2px; }
.btn.primary { background: var(--pen); color: var(--paper); }
.btn.small { padding: 7px 11px; font-size: 13px; }
.btn:disabled { opacity: .4; cursor: default; transform: none; box-shadow: 2px 2px 0 var(--pen); }
.btn[hidden] { display: none; }
.btn.star-btn[aria-pressed="true"] { background: var(--gold); color: #fff; border-color: #7a5600; box-shadow: 2px 2px 0 #7a5600; }
.btn.strike-btn[aria-pressed="true"] { background: var(--ink-o); color: #fff; border-color: #7d1d18; box-shadow: 2px 2px 0 #7d1d18; }

/* ---------- menu ---------- */
.screen.menu.active { display: grid; gap: 26px; }
.menu-hero { display: grid; gap: 4px; }
.logo { width: min(100%, 430px); height: auto; overflow: visible; display: block; }
.logo .stroke { fill: none; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .34s ease-out forwards; }
.logo .lx { stroke: var(--ink-x); }
.logo .lo { stroke: var(--ink-o); }
.logo .lv { stroke: var(--pen); }
.logo .s1 { animation-delay: .05s; } .logo .s2 { animation-delay: .3s; } .logo .s3 { animation-delay: .55s; }
.logo .s4 { animation-delay: .9s; } .logo .s6 { animation-delay: 1.25s; }
.logo .dot { fill: var(--pen); transform-box: fill-box; transform-origin: center; animation: pop .28s 1.15s both cubic-bezier(.3,1.7,.5,1); }
.logo .underline { fill: none; stroke: var(--ink-o); stroke-width: 4; stroke-linecap: round; opacity: .55; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .5s 1.5s ease-out forwards; }
.tagline { font-size: 17px; color: var(--pencil); margin: 0; max-width: 48ch; animation: fadeUp .5s .7s both; }
.tagline em { font-style: normal; color: var(--pencil-soft); }

.menu-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(290px, 360px); gap: 22px 32px; align-items: center; }
.profile {
  background: var(--paper); border: 2px solid var(--pen); border-radius: 8px 14px 6px 16px; box-shadow: 4px 5px 0 var(--pen);
  padding: 14px 16px; display: grid; gap: 10px; animation: fadeUp .5s .45s both; transform: rotate(.4deg);
}
.pf-top { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.pf-ava {
  width: 56px; height: 56px; border-radius: 50%; overflow: hidden; display: grid; place-items: center;
  border: 2px solid var(--pen); background: #e9eef8; box-shadow: 2px 2px 0 var(--pen);
}
.pf-ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pf-initial { font: 700 34px/1 var(--font-hand); color: var(--ink-x); transform: translateY(-1px); }
.pf-ava.guest { background: var(--paper); }
.pf-ava svg { width: 78%; height: 78%; fill: none; stroke: var(--pencil-soft); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
.pf-name { font: 700 28px/1 var(--font-hand); color: var(--pen); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pf-sub { font-size: 13px; line-height: 1.3; color: var(--pencil-soft); overflow-wrap: anywhere; }
.icon-btn {
  appearance: none; width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer;
  border: 1.5px solid var(--pen); border-radius: 50% 46% 52% 48%; background: var(--paper); color: var(--pen);
  box-shadow: 2px 2px 0 var(--pen); transition: transform .08s, box-shadow .08s;
}
.icon-btn:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--pen); }
.icon-btn:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--pen); }
.icon-btn:focus-visible { outline: 2px solid var(--ink-x); outline-offset: 2px; }
.icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn svg .spk { fill: currentColor; fill-opacity: .12; }
.icon-btn[aria-pressed="false"] { color: var(--pencil-soft); }
.pf-wallet { gap: 8px; }
.pf-stats { font-size: 13.5px; color: var(--pencil); font-variant-numeric: tabular-nums; }
.pf-stats b { color: var(--pen); }
.pf-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pf-row > span { color: var(--pencil); font-size: 14px; }
.profile .seg { font-size: 21px; padding: 4px 16px 6px; }
.profile .seg.lang { font-size: 13px; padding: 8px 11px; }
.tg-login { display: grid; gap: 8px; justify-items: start; }
.tg-login:empty { display: none; }
.tg-btn { display: inline-flex; align-items: center; gap: 7px; }
.ico-tg { width: 17px; height: 17px; fill: #229ed9; }
.btn.primary .ico-tg { fill: #fff; }
.link-btn { appearance: none; border: 0; background: none; padding: 0; font: inherit; font-size: 13px; color: var(--pencil-soft); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.tg-widget { display: grid; gap: 6px; }
.tg-widget:empty { display: none; }
.seg-group { display: inline-flex; border: 1.5px solid var(--pen); border-radius: 4px 9px 5px 10px; overflow: hidden; box-shadow: 2px 2px 0 var(--pen); }
.seg { appearance: none; border: 0; background: var(--paper); font: 700 24px/1 var(--font-hand); padding: 5px 18px 7px; cursor: pointer; color: var(--pencil-soft); transition: background .2s, color .2s; }
.seg + .seg { border-left: 1.5px solid var(--pen); }
.seg.lang { font: 600 14px/1 var(--font-body); padding: 9px 12px; letter-spacing: .04em; }
.seg.lang[aria-pressed="true"] { background: var(--pen); color: var(--paper); }
.seg[aria-pressed="true"][data-side="1"] { background: var(--ink-x); color: #fff; }
.seg[aria-pressed="true"][data-side="2"] { background: var(--ink-o); color: #fff; }

.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px; align-items: start; }
.mode-card {
  background: var(--paper);
  border: 2px solid var(--pen);
  border-radius: 6px 14px 8px 16px;
  padding: 18px 18px 16px;
  box-shadow: 5px 6px 0 var(--pen);
  display: grid; gap: 14px; align-content: start;
  animation: fadeUp .55s both;
}
.mode-card:nth-child(1) { animation-delay: .3s; }
.mode-card:nth-child(2) { animation-delay: .45s; }
.mode-card h2 { font-family: var(--font-hand); font-size: 42px; margin: 0; line-height: .95; color: var(--pen); }
.mode-card h2 .x { color: var(--ink-x); } .mode-card h2 .o { color: var(--ink-o); }
.mode-card header p { margin: 6px 0 0; color: var(--pencil); }
.opponents { display: grid; gap: 9px; }
.opp {
  appearance: none; text-align: left; font: inherit; color: inherit;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 12px;
  padding: 9px 12px 10px;
  border: 1.5px solid var(--pen);
  border-radius: 3px 8px 4px 9px;
  background: var(--paper);
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--pen);
  transition: transform .08s, box-shadow .08s, background .15s;
}
.opp:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--pen); background: #fffdf1; }
.opp:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--pen); }
.opp-name { font-family: var(--font-hand); font-size: 27px; font-weight: 700; line-height: 1; color: var(--pen); }
.opp-line { grid-column: 1; font-size: 13.5px; color: var(--pencil-soft); }
.opp-meta { grid-row: 1 / span 2; grid-column: 2; display: grid; justify-items: end; gap: 5px; }
.pips { display: inline-flex; gap: 3px; }
.pip { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink-o); }
.pip.on { background: var(--ink-o); }
.opp-score { font-size: 12.5px; color: var(--pencil-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.menu-foot { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; animation: fadeUp .5s .65s both; }
.menu-foot small { color: var(--pencil-soft); }

/* ---------- game bar ---------- */
.game-bar { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; margin-bottom: 18px; }
.bar-title { display: flex; align-items: center; gap: 10px; flex: 1 1 260px; min-width: 0; }
.bt-text { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
.mini-logo { font-family: var(--font-hand); font-weight: 700; font-size: 36px; color: var(--pen); line-height: 1; }
.mini-logo .x { color: var(--ink-x); } .mini-logo .o { color: var(--ink-o); }
.vs { color: var(--pencil); font-size: 15px; }
.vs b { font-family: var(--font-hand); font-size: 23px; color: var(--pen); }
.score-chip { font-variant-numeric: tabular-nums; font-size: 13.5px; padding: 4px 11px; border: 1.5px dashed var(--grid-strong); border-radius: 20px; color: var(--pencil); background: var(--paper); }
.score-chip[hidden] { display: none; }

/* ---------- game layout ---------- */
.game-grid { display: grid; grid-template-columns: minmax(0, 600px) minmax(260px, 1fr); gap: 32px; align-items: start; }
.classic-grid { display: grid; grid-template-columns: minmax(0, 470px) minmax(260px, 1fr); gap: 36px; align-items: start; }
.board-wrap { position: relative; }

/* ---------- 9x9 board ---------- */
.board {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
  background: transparent; padding: 0; position: relative;
  aspect-ratio: 1; width: 100%;
}
.hand-grid { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 3; }
.hand-grid path { fill: none; stroke: var(--pen); stroke-linecap: round; }
.hand-grid.drawn path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .32s ease-out forwards; }
.hand-grid.g9 path { stroke-width: .95; }
.hand-grid.g3 path { stroke-width: 1.35; }
.hand-grid.gm path { stroke-width: 1.6; }
.in-prelude .board, .in-prelude .main-only { display: none !important; }
.sub { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--paper); isolation: isolate; }
.sub::before {
  content: ""; position: absolute; inset: 3px; background: var(--marker); opacity: 0;
  transform: skew(-2deg) rotate(-.6deg) scaleX(0); transform-origin: left center;
  border-radius: 6px 2px 8px 3px; z-index: -1;
  transition: opacity .2s, transform .38s cubic-bezier(.3,.8,.3,1);
}
.sub.allowed::before { opacity: .92; transform: skew(-2deg) rotate(-.6deg) scaleX(1); }
.sub.allowed.target::before { background: var(--marker-target); }
.sub.won-now { animation: thump .5s ease-out; }
.sub.sent { animation: sentPulse .8s ease-out; }
@keyframes sentPulse { 0% { box-shadow: inset 0 0 0 0 rgba(31,63,168,.0); } 30% { box-shadow: inset 0 0 0 4px rgba(31,63,168,.55); } 100% { box-shadow: inset 0 0 0 0 rgba(31,63,168,0); } }
.sub-num { position: absolute; left: 4px; top: 0; font-family: var(--font-hand); font-size: 15px; color: var(--grid-strong); pointer-events: none; z-index: 2; }
.cell {
  appearance: none; border: 0; background: transparent; padding: 0; margin: 0; cursor: pointer; position: relative;
  border-right: 1px solid var(--grid-strong); border-bottom: 1px solid var(--grid-strong);
  aspect-ratio: 1; min-width: 0;
}
.cell:nth-of-type(3n) { border-right: 0; }
.cell:nth-of-type(n+7) { border-bottom: 0; }
.cell[data-legal="1"]:hover { background: rgba(31,63,168,.09); }
.cell[data-legal="0"] { cursor: default; }
.cell:focus-visible { outline: 2px solid var(--ink-x); outline-offset: -2px; z-index: 3; }
.cell > svg.mark { position: absolute; inset: 14%; width: 72%; height: 72%; overflow: visible; transition: opacity .2s .3s; }
.cell.last { background: rgba(255,232,120,.55); }
.cell.last::after { content: ""; position: absolute; right: 3px; bottom: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--pen); opacity: .55; }
.cell > svg.mark.fresh { animation: stamp .32s cubic-bezier(.3,1.5,.5,1); }
@keyframes stamp { 0% { transform: scale(1.25); } 100% { transform: scale(1); } }
.sub.only::before { animation: markerBreath 1.9s ease-in-out .4s infinite; }
@keyframes markerBreath { 0%, 100% { opacity: .92; } 50% { opacity: .55; } }
.board.locked .cell { cursor: progress; }
.board.strike-mode .cell[data-legal="1"] { cursor: crosshair; }
.board.strike-mode .cell[data-legal="1"]:hover { background: rgba(196,54,47,.12); }

.mark path { fill: none; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
.mark.x path { stroke: var(--ink-x); }
.mark.o path { stroke: var(--ink-o); }
.mark.fresh path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .3s ease-out forwards; }
.mark.fresh path:nth-child(2) { animation-delay: .15s; }
.mark.fresh path:nth-child(3) { animation-delay: .22s; }
.mark.fresh path:nth-child(4) { animation-delay: .29s; }
/* skins: pen colors */
.mark.col-purple path, .overlay.col-purple path, .fly.col-purple path { stroke: #6b3fa0; }
.mark.col-graphite path, .overlay.col-graphite path, .fly.col-graphite path { stroke: #4a4d55; }
.mark.col-green path, .overlay.col-green path, .fly.col-green path { stroke: #1f8a4c; }
.mark.col-orange path, .overlay.col-orange path, .fly.col-orange path { stroke: #d9731a; }
/* premium: golden marks */
.mark.gold path, .overlay.gold path, .fly.gold path { stroke: #b8860b; }
.mark.gold { animation: goldGlow 2.4s ease-in-out infinite; }
@keyframes goldGlow { 0%, 100% { filter: drop-shadow(0 0 1px rgba(255,190,0,.45)); } 50% { filter: drop-shadow(0 0 6px rgba(255,200,40,.95)); } }
.mark.gold.fresh { animation: goldGlow 2.4s ease-in-out infinite, goldPop .6s cubic-bezier(.3,1.6,.5,1); }
@keyframes goldPop { 0% { transform: scale(.4) rotate(-20deg); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
.mark.is-star path { stroke-width: 7; }
.mark.is-star.x path { fill: rgba(31,63,168,.12); }
.mark.is-star.o path { fill: rgba(196,54,47,.12); }

.cell.struck > svg.mark { animation: shake .34s ease-in-out; opacity: 0; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-4px) rotate(-6deg); } 40% { transform: translateX(4px) rotate(6deg); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.scratch { position: absolute; inset: 6%; width: 88%; height: 88%; overflow: visible; pointer-events: none; z-index: 2; }
.scratch path { fill: none; stroke: var(--pen); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .24s .08s ease-out forwards; }

.overlay { position: absolute; inset: 6%; width: 88%; height: 88%; pointer-events: none; z-index: 1; opacity: .22; overflow: visible; }
.overlay path { fill: none; stroke-width: 7; stroke-linecap: round; }
.overlay.x path { stroke: var(--ink-x); } .overlay.o path { stroke: var(--ink-o); }
.overlay.fresh path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .45s ease-out forwards; }
.overlay.fresh path:nth-child(2) { animation-delay: .2s; }
.ring { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; overflow: visible; }
.ring path { fill: none; stroke-width: 2.4; stroke-linecap: round; opacity: .7; }
.ring.x path { stroke: var(--ink-x); } .ring.o path { stroke: var(--ink-o); }
.ring.fresh path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .55s .15s ease-out forwards; }
.sub.neutral { background-image: repeating-linear-gradient(-45deg, transparent 0 7px, rgba(107,112,122,.18) 7px 8px); }

.fly { position: fixed; z-index: 50; pointer-events: none; }
.fly svg { width: 100%; height: 100%; overflow: visible; }
.fly path { fill: none; stroke-width: 7; stroke-linecap: round; }
.fly.x path { stroke: var(--ink-x); } .fly.o path { stroke: var(--ink-o); }

/* ---------- banner ---------- */
.banner { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(246,247,242,.74); z-index: 5; }
.banner.show { display: flex; animation: fadeIn .3s .55s both; }
.banner-card {
  background: var(--paper); border: 2px solid var(--pen); border-radius: 4px 10px 6px 12px;
  padding: 20px 26px; text-align: center; box-shadow: 5px 6px 0 var(--pen);
  display: grid; gap: 10px; justify-items: center; max-width: 88%;
  animation: dropIn .6s .6s both cubic-bezier(.2,1.3,.4,1);
}
@keyframes dropIn { from { transform: translateY(-34px) rotate(-7deg); opacity: 0; } to { transform: rotate(-1.2deg); opacity: 1; } }
.banner-title { font-family: var(--font-hand); font-size: 46px; font-weight: 700; line-height: 1; color: var(--pen); text-wrap: balance; }
.banner-text { max-width: 36ch; }
.taunt { font-family: var(--font-hand); font-size: 27px; line-height: 1.1; color: var(--ink-o); }
.taunt:empty { display: none; }
.banner-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

/* ---------- notes column ---------- */
aside.notes { display: grid; gap: 22px; }
.turn { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
.turn svg { width: 64px; height: 64px; overflow: visible; }
.turn-who { font-family: var(--font-hand); font-size: 34px; font-weight: 700; line-height: 1; color: var(--pen); }
.turn-where { color: var(--pencil); }
.thinking { display: inline-flex; gap: 4px; margin-left: 8px; vertical-align: middle; }
.thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--pen); animation: bob 1s infinite ease-in-out; }
.thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 0%, 80%, 100% { transform: translateY(0); opacity: .35; } 40% { transform: translateY(-5px); opacity: 1; } }
.status { min-height: 3em; font-family: var(--font-hand); font-size: 23px; line-height: 1.15; color: var(--pen); }
.status.star { color: #9a6a00; }
.status.warn { color: var(--ink-o); animation: shake .3s; }
.label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--pencil-soft); font-weight: 500; margin: 0 0 6px; }
.stars { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stars-count { font-variant-numeric: tabular-nums; color: var(--pencil); }
.stars-count b.x { color: var(--ink-x); } .stars-count b.o { color: var(--ink-o); }
.stars-count .st { color: var(--gold); display: inline-block; }
.stars-count .st.pop { animation: popStar .65s cubic-bezier(.3,1.6,.5,1); }
@keyframes popStar { 0% { transform: scale(.2) rotate(-50deg); } 60% { transform: scale(1.7) rotate(12deg); } 100% { transform: scale(1) rotate(0); } }
.main-board { display: grid; grid-template-columns: repeat(3, 1fr); width: 168px; aspect-ratio: 1; position: relative; }
.mcell { position: relative; }
.mcell .n { position: absolute; left: 4px; top: 0; font-family: var(--font-hand); font-size: 14px; color: var(--grid-strong); }
.mcell svg { position: absolute; inset: 16%; width: 68%; height: 68%; overflow: visible; }
.mcell.neutral { background-image: repeating-linear-gradient(-45deg, transparent 0 6px, rgba(107,112,122,.3) 6px 7px); }
.mcell.arrive .mark.fresh path { animation-delay: .62s; }
.mcell.arrive .mark.fresh path:nth-child(2) { animation-delay: .76s; }
.mcell.arrive { animation: thump .45s .7s ease-out; }
.strike-line { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.strike-line path { fill: none; stroke: var(--pen); stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .45s .35s ease-out forwards; }
.strike-line.x path, .ttt-line.x path { stroke: var(--ink-x); }
.strike-line.o path, .ttt-line.o path { stroke: var(--ink-o); }
.buttons { display: flex; flex-wrap: wrap; gap: 10px; }
.log { margin: 0; padding: 0; list-style: none; max-height: 210px; overflow-y: auto; font-variant-numeric: tabular-nums; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; font-size: 14px; }
.log li { padding: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log .num { color: var(--pencil-soft); display: inline-block; min-width: 2.2em; }
.log .px { color: var(--ink-x); font-weight: 700; } .log .po { color: var(--ink-o); font-weight: 700; }
.log .note { color: var(--pencil-soft); } .log .note.s { color: #9a6a00; } .log .note.k { color: var(--ink-o); }
.empty { color: var(--pencil-soft); font-size: 14px; }

/* ---------- 3x3 boards (warm-up and Ностальгия) ---------- */
.ttt { display: grid; grid-template-columns: repeat(3, 1fr); aspect-ratio: 1; width: 100%; position: relative; background: transparent; }
.tcell { appearance: none; border: 0; background: transparent; position: relative; cursor: pointer; padding: 0; }
.tcell:hover:not(:disabled) { background: rgba(31,63,168,.07); }
.tcell:disabled { cursor: default; }
.tcell:focus-visible { outline: 2px solid var(--ink-x); outline-offset: -4px; }
.tcell svg { position: absolute; inset: 15%; width: 70%; height: 70%; overflow: visible; }
.ttt-line { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.ttt-line { z-index: 4; }
.ttt-line path { fill: none; stroke: var(--pen); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .42s .3s ease-out forwards; opacity: .9; }
.classic-wrap { position: relative; }
.classic-wrap .ttt { box-shadow: none; }

/* ---------- warm-up ---------- */
.prelude { display: grid; gap: 14px; justify-items: start; }
.prelude[hidden] { display: none; }
.prelude-head p { margin: 0; color: var(--pencil); max-width: 52ch; }
.prelude-title { font-family: var(--font-hand); font-size: 42px; line-height: 1; margin: 0 0 4px; color: var(--pen); }
.prelude .ttt { width: min(100%, 360px); }
.prelude-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.in-coin .prelude-head, .in-coin .ttt, .in-coin .prelude-actions { display: none !important; }

/* ---------- coin ---------- */
.coin-stage[hidden] { display: none; }
.coin-stage { display: grid; justify-items: center; align-content: center; gap: 18px; width: 100%; min-height: 440px; padding: 24px 0; text-align: center; animation: fadeIn .4s both; }
.coin-title { font-family: var(--font-hand); font-size: 44px; line-height: 1; margin: 0; color: var(--pen); text-wrap: balance; }
.coin-zone { position: relative; width: 190px; height: 300px; display: grid; justify-items: center; align-items: end; perspective: 900px; }
.coin { width: 150px; height: 150px; position: relative; transform-style: preserve-3d; margin-bottom: 26px; }
.coin .face {
  position: absolute; inset: 0; border-radius: 50%; backface-visibility: hidden; display: grid; place-items: center;
  background: radial-gradient(circle at 34% 30%, #fbf1cf, var(--coin) 58%, var(--coin-edge));
  border: 4px solid var(--coin-edge);
  box-shadow: inset 0 0 0 9px rgba(169,133,58,.22), inset 0 0 0 11px rgba(255,255,255,.35);
}
.coin .face svg { width: 54%; height: 54%; overflow: visible; }
.coin .face.fo { transform: rotateX(180deg); }
.coin.golden .face { background: radial-gradient(circle at 34% 30%, #fffbe6, #ffd54a 50%, #c48a00); border-color: #b07800; box-shadow: inset 0 0 0 9px rgba(255,255,255,.35), 0 0 28px 6px rgba(255,200,40,.65); }
.coin.golden { animation: glow 1.6s ease-in-out infinite alternate; }
@keyframes glow { from { filter: drop-shadow(0 0 6px rgba(255,200,40,.5)); } to { filter: drop-shadow(0 0 18px rgba(255,200,40,.95)); } }
.coin-shadow { position: absolute; bottom: 8px; width: 120px; height: 16px; border-radius: 50%; background: rgba(43,58,85,.22); filter: blur(3px); }
.coin-result { font-family: var(--font-hand); font-size: 34px; line-height: 1.1; color: var(--pen); min-height: 1.1em; margin: 0; }
.coin-result.golden { color: #a86f00; }
.coin-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

/* ---------- rules sheet ---------- */
.sheet { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(43,58,85,.38); padding: 16px; animation: fadeIn .2s both; }
.sheet[hidden] { display: none; }
.sheet-card {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  max-width: 660px; width: 100%; max-height: min(88vh, 780px); overflow: auto;
  border: 2px solid var(--pen); border-radius: 6px 14px 8px 16px; box-shadow: 6px 7px 0 var(--pen);
  padding: 20px 24px 24px; animation: sheetIn .35s both cubic-bezier(.2,1.2,.4,1);
}
@keyframes sheetIn { from { transform: translateY(24px) rotate(-1.5deg); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
.sheet h2 { font-family: var(--font-hand); font-size: 40px; margin: 0; color: var(--pen); line-height: 1; }
.sheet h3 { font-family: var(--font-hand); font-size: 28px; margin: 18px 0 4px; color: var(--pen); }
.sheet p { margin: 0 0 8px; max-width: 62ch; }
.sheet ol { margin: 0; padding-left: 1.4em; display: grid; gap: 7px; }
.sheet li::marker { font-family: var(--font-hand); font-size: 1.25em; color: var(--ink-o); }
.sheet b { color: var(--pen); }
.sheet li.mystery { color: var(--pencil-soft); font-style: italic; }
.sheet li.mystery b { font-style: normal; color: var(--ink-o); letter-spacing: .1em; }

/* ---------- wallet & shop ---------- */
.wallet { display: inline-flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.cur { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px 4px 6px; border: 1.5px solid var(--pen); border-radius: 20px; background: var(--paper); font-variant-numeric: tabular-nums; }
.cur b { color: var(--pen); }
.cur-name { color: var(--pencil-soft); font-size: 13px; }
.ico-clip { width: 18px; height: 18px; fill: none; stroke: #5b6b86; stroke-width: 2; stroke-linecap: round; transform: rotate(35deg); }
.ico-coin { width: 18px; height: 18px; }
.ico-coin circle { fill: #e8d59a; stroke: #a9853a; stroke-width: 2; }
.ico-coin path { stroke: #1f3fa8; stroke-width: 2.2; stroke-linecap: round; fill: none; }
.coin-prev { display: grid; place-items: center; }
.item-prev.ex-prev { display: flex; align-items: center; justify-content: center; gap: 4px; width: auto; }
.ex-prev svg { flex: none; }
.ex-prev .ico-coin { width: 30px; height: 30px; }
.ex-prev .ico-clip { width: 30px; height: 30px; }
.ex-arrow { font: 700 22px/1 var(--font-hand); color: var(--pencil-soft); }
.coin-prev .ico-coin { width: 46px; height: 46px; }
.item .btn .ico-clip, .item .btn .ico-coin { width: 15px; height: 15px; }
.btn.gold-btn .ico-coin circle { fill: #fff3cf; }
.btn.primary .ico-clip { stroke: #fff; }
.reward-pop .ico-clip { width: 22px; height: 22px; vertical-align: -3px; }
.gold-pop { color: #a87800; }
.banner-reward { display: grid; gap: 4px; justify-items: center; }
.quote { font-family: var(--font-hand); font-size: 22px; color: var(--pen); max-width: 30ch; animation: fadeUp .5s 1.5s both; }
.shop-note.quote { color: #a87800; font-size: 28px; }
.ico-five { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 3px; border: 2px solid var(--ink-o); border-radius: 50%; color: var(--ink-o); font: 700 15px/1 var(--font-hand); font-style: normal; transform: rotate(-8deg); }
.ico-ink { width: 18px; height: 18px; fill: #2f3fb0; }
.shop-body { display: grid; gap: 22px; }
.shop-sec h3 { font-family: var(--font-hand); font-size: 32px; margin: 0 0 6px; color: var(--pen); line-height: 1; }
.shop-hint { margin: 0 0 10px; color: var(--pencil-soft); max-width: 70ch; }
.shop-hint.earn { color: var(--pencil); }
.shop-note { margin: 0; font-family: var(--font-hand); font-size: 24px; animation: fadeUp .3s both; }
.shop-note.ok { color: #1f8a4c; } .shop-note.warn { color: var(--ink-o); }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.item { background: var(--paper); border: 1.5px solid var(--pen); border-radius: 4px 10px 6px 12px; box-shadow: 3px 3px 0 var(--pen); padding: 12px; display: grid; gap: 6px; justify-items: center; text-align: center; transition: transform .12s; }
.item:hover { transform: translateY(-2px); }
.item.on { box-shadow: 3px 3px 0 var(--ink-x), 0 0 0 2px var(--ink-x) inset; }
.item.premium { background: linear-gradient(160deg, #fffaf0, #fff3cf); border-color: #a97c00; box-shadow: 3px 3px 0 #a97c00; }
.item.just-bought { animation: thump .5s ease-out; }
.item-prev { width: 72px; height: 72px; position: relative; }
.item-prev svg.mark { width: 100%; height: 100%; overflow: visible; }
.ink-prev { display: grid; place-items: center; }
.ink-prev .ico-ink { width: 44px; height: 44px; }
.item-name { font-family: var(--font-hand); font-size: 22px; font-weight: 700; color: var(--pen); line-height: 1.05; }
.item-price { font-size: 12.5px; color: var(--pencil-soft); min-height: 1.2em; }
.item .btn { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-size: 12.5px; padding: 7px 9px; }
.item .btn .ico-five { min-width: 18px; height: 18px; font-size: 12px; border-width: 1.5px; }
.item .btn .ico-ink { width: 14px; height: 14px; }
.btn.gold-btn { background: #c99700; color: #fff; border-color: #7a5a00; box-shadow: 2px 2px 0 #7a5a00; }
.btn.gold-btn .ico-ink { fill: #fff; }
.banner-reward:empty { display: none; }
.reward-pop { display: inline-block; font-family: var(--font-hand); font-size: 28px; font-weight: 700; color: #1f8a4c; animation: popStar .7s 1.1s both cubic-bezier(.3,1.6,.5,1); }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .app { padding-left: 16px; }
  .menu-top { grid-template-columns: 1fr; }
  .profile { transform: none; }
  body { background-size: 0 0, 22px 22px, 22px 22px; }
  .modes, .game-grid, .classic-grid { grid-template-columns: 1fr; }
  .game-grid, .classic-grid { gap: 22px; }
  .turn { grid-template-columns: 52px 1fr; }
  .turn svg { width: 52px; height: 52px; }
}
@media (max-width: 600px) {
  .game-bar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; }
  .game-bar > [data-act="menu"] { grid-column: 1; grid-row: 1; }
  .bar-title { grid-column: 2; grid-row: 1; gap: 8px; }
  .bt-text { flex-direction: column; gap: 0; align-items: flex-start; }
  .bot-face { width: 42px; height: 42px; }
  .game-bar > [data-act="rules"] { grid-column: 3; grid-row: 1; }
  .score-chip { grid-column: 1 / -1; justify-self: start; }
  .mini-logo { font-size: 26px; }
  .vs { font-size: 13px; line-height: 1.25; }
  .vs b { font-size: 19px; }
  .game-bar .btn.small { padding: 7px 9px; }
  .status { min-height: 2.4em; font-size: 21px; }
}
@media (max-width: 420px) {
  .board { gap: 4px; }
  .hand-grid.g9 path { stroke-width: 1.05; }
  .mark path { stroke-width: 11; }
  .mode-card h2 { font-size: 36px; }
  .coin-stage { min-height: 380px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
  .coin.golden { animation: none; }
}

/* ---------- play a friend by link ---------- */
.on-online { display: none; }
.is-online .on-online { display: inline-block; }
.is-online .off-online { display: none; }
.opp.opp-link { border-style: dashed; }
.opp.opp-link .opp-name { color: var(--ink-x); }
.ico-link { width: 22px; height: 22px; fill: none; stroke: var(--ink-x); stroke-width: 2; stroke-linecap: round; }
.online-games[hidden] { display: none; }
.online-games { display: grid; gap: 10px; animation: fadeUp .4s both; }
.online-games h3 { font-family: var(--font-hand); font-size: 30px; margin: 0; color: var(--pen); line-height: 1; }
.og-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.og {
  appearance: none; text-align: left; font: inherit; color: inherit; cursor: pointer;
  display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  padding: 9px 12px; background: var(--paper); border: 1.5px solid var(--pen); border-radius: 3px 8px 4px 9px; box-shadow: 2px 2px 0 var(--pen);
}
.og:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--pen); }
.og.my-turn { background: #fffbe0; }
.og-name, .og-sub { display: block; }
.og-name { font: 700 22px/1.05 var(--font-hand); color: var(--pen); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.og-sub { font-size: 12.5px; color: var(--pencil-soft); }
.og-flag { font: 700 18px/1 var(--font-hand); color: var(--pencil-soft); white-space: nowrap; }
.og.my-turn .og-flag { color: var(--ink-o); }
.mini-ava { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; border: 1.5px solid var(--pen); background: #e9eef8; flex: none; }
.mini-ava img { width: 100%; height: 100%; object-fit: cover; }
.mini-ava span { font: 700 22px/1 var(--font-hand); color: var(--ink-x); }
.vs .mini-ava { display: inline-grid; width: 24px; height: 24px; vertical-align: -6px; margin-right: 4px; border-width: 1px; }
.vs .mini-ava span { font-size: 15px; }

.online-card { max-width: 440px; }
.online-card .ob { display: grid; gap: 16px; padding-top: 6px; }
.online-card .ob p { margin: 0; }
.min-pick { display: flex; gap: 0; }
.min-pick .seg { font: 600 16px/1 var(--font-body); padding: 10px 16px; }
.min-pick .seg[aria-pressed="true"] { background: var(--pen); color: var(--paper); }
.ob-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.wait-card { max-width: 480px; margin: 20px auto 0; display: grid; gap: 14px; justify-items: center; text-align: center; padding: 26px 22px;
  background: var(--paper); border: 2px solid var(--pen); border-radius: 6px 14px 8px 16px; box-shadow: 5px 6px 0 var(--pen); }
.wait-title { font-family: var(--font-hand); font-size: 44px; margin: 0; line-height: 1; color: var(--pen); }
.wait-text { margin: 0; max-width: 36ch; }
.wait-meta { margin: 0; color: var(--pencil-soft); font-size: 14px; }
.wait-link { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: #fff; border: 1.5px dashed var(--grid-strong); border-radius: 6px; padding: 8px 10px; word-break: break-all; user-select: all; max-width: 100%; }
.wait-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.wait-dots { display: inline-flex; gap: 8px; }
.wait-dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--ink-x); animation: bob 1.1s infinite ease-in-out; }
.wait-dots i:nth-child(2) { background: var(--ink-o); animation-delay: .15s; } .wait-dots i:nth-child(3) { background: var(--pen); animation-delay: .3s; }

.clock { font: 700 26px/1 var(--font-hand); color: var(--pen); display: flex; align-items: center; gap: 8px; }
.clock[hidden] { display: none; }
.clock b { font-variant-numeric: tabular-nums; font-family: var(--font-body); font-size: 20px; padding: 3px 9px; border: 1.5px solid var(--pen); border-radius: 6px; background: #fff; }
.clock.mine b { background: #fffbe0; }
.clock.low b { color: #fff; background: var(--ink-o); border-color: #7d1d18; animation: shake .4s; }
.clock span { font-size: 22px; color: var(--pencil); font-weight: 400; }

.phrases[hidden] { display: none; }
.phrases { display: flex; flex-wrap: wrap; gap: 6px; }
.phrase { appearance: none; font: 500 13.5px/1 var(--font-body); padding: 8px 11px; border: 1.5px solid var(--pen); border-radius: 16px 16px 16px 4px; background: #fff; color: var(--pen); cursor: pointer; }
.phrase:hover { background: #fffbe0; }

  border: 2px solid var(--pen); border-radius: 18px 18px 18px 5px; box-shadow: 3px 3px 0 var(--pen);

}

/* ---------- bot faces and talk ---------- */

@keyframes facePop { 0% { transform: scale(.8) rotate(-6deg); } 100% { transform: scale(1) rotate(0); } }

<script>
// X02.0 engine: rules for the main game, the classic 3x3 game, and the bots.
// Written as one self-contained function so the same source can run on the page and inside a Web Worker.
function ENGINE() {
  "use strict";
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const CL = [[], [], [], [], [], [], [], [], []];
  for (const l of LINES) for (const i of l) CL[i].push(l);
  const pick = arr => arr[(Math.random() * arr.length) | 0];

  // ================= main game =================
  // Players: 1 = X, 2 = O. Cell index i = board * 9 + cell.
  // Actions: 0..80 place, 100..180 place a star (navigator), 200..280 strike, 300..308 choose the opponent's board.
  function newMain(first, bonus) {
    const stars = [0, 0, 0];
    if (bonus) { stars[1] = bonus[1] || 0; stars[2] = bonus[2] || 0; }
    return {
      cells: new Array(81).fill(0), star: new Array(81).fill(0),
      owner: new Array(9).fill(0),      // 0 open, 1 X, 2 O, 3 neutral (draw)
      filled: new Array(9).fill(0),
      stars, turn: first || 1, active: -1, choosing: 0, free: 0,
      result: 0, byCount: 0, secret: -1, winLine: null, last: -1, moves: 0, log: []
    };
  }
  function cloneLite(s) {
    return {
      cells: s.cells.slice(), star: s.star.slice(), owner: s.owner.slice(), filled: s.filled.slice(),
      stars: s.stars.slice(), turn: s.turn, active: s.active, choosing: s.choosing, free: s.free,
      result: s.result, byCount: s.byCount, secret: s.secret, winLine: s.winLine, last: s.last, moves: s.moves, log: null
    };
  }
  function cloneFull(s) {
    const n = cloneLite(s);
    n.log = s.log ? s.log.map(e => Object.assign({}, e)) : [];
    return n;
  }
  function allowed(s) {
    if (s.result) return [];
    if (!s.choosing && s.active >= 0 && s.filled[s.active] < 9) return [s.active];
    const r = [];
    for (let b = 0; b < 9; b++) if (s.filled[b] < 9) r.push(b);
    return r;
  }
  function mainLine(owner) {
    for (const l of LINES) {
      const v = owner[l[0]];
      if ((v === 1 || v === 2) && owner[l[1]] === v && owner[l[2]] === v) return l;
    }
    return null;
  }
  function noRowPossible(owner) {
    for (const l of LINES) {
      let x = 0, o = 0, d = 0;
      for (const i of l) { const v = owner[i]; if (v === 1) x++; else if (v === 2) o++; else if (v === 3) d++; }
      if (!d && !(x && o)) return false;
    }
    return true;
  }
  function count(owner) {
    let x = 0, o = 0;
    for (const v of owner) { if (v === 1) x++; else if (v === 2) o++; }
    return [0, x, o];

<li><b>Разминка.</b> Сначала обычные крестики-нолики 3×3, начинает X. Победитель получает ★ на старт, проигравший ходит первым в партии. При ничьей звёзд нет, а первый ход решает монета.</li>
<li><b>Куда ходить.</b> Ход в клетку <b>N</b> отправляет соперника в поле <b>N</b> (оно подсвечено маркером). Первый ход, свободный ход и ход, когда тебя отправили в заполненное поле, можно делать в любое поле.</li>
<li><b>Маленькие поля.</b> Три в ряд — поле твоё навсегда, твой знак встаёт на главное поле, а проигравший получает свободный ход. Ставить в выигранное поле можно и дальше. Ничья делает клетку главного поля нейтральной.</li>

<li><b>Победа.</b> Три в ряд на главном поле. Если ряд уже невозможен, доигрываете, и побеждает тот, у кого больше знаков на главном поле. Поровну — ничья.</li>

  rulesHTML: `<p>Navbat bilan belgi qo'ying, kichik maydonlarni yuting va asosiy maydonda uchtasini bir qatorga tering. Lekin qayerga yurishni o'zingiz tanlamaysiz: sizning yurishingiz raqib qayerga yurishini belgilaydi.</p>
<ol>
<li><b>Razminka.</b> Avval oddiy 3×3 iks-nol, X boshlaydi. G'olib boshlanishiga ★ oladi, yutqazgan esa o'yinda birinchi yuradi. Durang bo'lsa, yulduz berilmaydi, birinchi yurishni tanga hal qiladi.</li>
<li><b>Qayerga yurish.</b> <b>N</b>-katakka qilingan yurish raqibni <b>N</b>-maydonga yuboradi (u marker bilan belgilangan). Birinchi yurish, erkin yurish va to'lgan maydonga yuborilgandagi yurish istalgan maydonga qilinadi.</li>

function roughRing(k) {
  const pts = [[5, 7], [50, 3], [95, 6], [97, 50], [94, 95], [50, 97], [6, 94], [3, 50], [7, 9]];
  const p = pts.map(([x, y], i) => [x + jit(k, i, 3), y + jit(k, i + 20, 3)]);
  let d = `M${p[0][0].toFixed(1)} ${p[0][1].toFixed(1)}`;
  for (let i = 1; i < p.length; i += 2) d += ` Q${p[i][0].toFixed(1)} ${p[i][1].toFixed(1)} ${p[i + 1][0].toFixed(1)} ${p[i + 1][1].toFixed(1)}`;
  return d;
}
function polyPath(k, n, r, rot) {
  let d = "";
  for (let i = 0; i < n; i++) {
    const a = rot + i * 2 * Math.PI / n;
    d += (i ? " L" : "M") + (50 + Math.cos(a) * r + jit(k, i, 4)).toFixed(1) + " " + (52 + Math.sin(a) * r + jit(k, i + 9, 4)).toFixed(1);
  }
  return d + " Z";
}
function shapePaths(p, k, shape) {
  switch (shape) {
    case "x_plus": return [`M${(50 + jit(k, 1, 5)).toFixed(1)} 12 L${(50 + jit(k, 3, 5)).toFixed(1)} 88`, `M12 ${(50 + jit(k, 6, 5)).toFixed(1)} L88 ${(50 + jit(k, 8, 5)).toFixed(1)}`];
    case "x_star": return [90, 30, 150].map((deg, i) => {
      const a = deg * Math.PI / 180, dx = Math.cos(a) * 40, dy = Math.sin(a) * 40;
      return `M${(50 - dx + jit(k, i, 3)).toFixed(1)} ${(50 - dy + jit(k, i + 3, 3)).toFixed(1)} L${(50 + dx + jit(k, i + 6, 3)).toFixed(1)} ${(50 + dy + jit(k, i + 9, 3)).toFixed(1)}`;
    });
    case "x_hash": return [`M${(40 + jit(k, 1, 3)).toFixed(1)} 12 L${(32 + jit(k, 2, 3)).toFixed(1)} 88`, `M${(70 + jit(k, 3, 3)).toFixed(1)} 12 L${(62 + jit(k, 4, 3)).toFixed(1)} 88`,
      `M12 ${(38 + jit(k, 5, 3)).toFixed(1)} L88 ${(35 + jit(k, 6, 3)).toFixed(1)}`, `M12 ${(66 + jit(k, 7, 3)).toFixed(1)} L88 ${(63 + jit(k, 8, 3)).toFixed(1)}`];
    case "x_skew": return [`M${(30 + jit(k, 1, 4)).toFixed(1)} 88 L${(70 + jit(k, 2, 4)).toFixed(1)} 12`, `M16 ${(52 + jit(k, 3, 4)).toFixed(1)} L84 ${(47 + jit(k, 4, 4)).toFixed(1)}`];
    case "o_square": return [polyPath(k, 4, 45, Math.PI / 4)];
    case "o_diamond": return [polyPath(k, 4, 42, -Math.PI / 2)];
    case "o_pent": return [polyPath(k, 5, 42, -Math.PI / 2)];
    case "o_hex": return [polyPath(k, 6, 41, 0)];
    default: return p === 1 ? xPaths(k) : [oPath(k)];
  }
}
const pathsFor = (p, k, star, sk) => (star ? [starPath(k)] : shapePaths(p, k, (sk || skinOf(p)).shape)).map(d => `<path pathLength="1" d="${d}"/>`).join("");
function markSVG(p, k, cls, star, sk) {
  sk = sk || skinOf(p);
  return `<svg viewBox="0 0 100 100" aria-hidden="true" class="mark ${p === 1 ? "x" : "o"}${star ? " is-star" : ""}${skinClasses(sk)} ${cls || ""}">${pathsFor(p, k, star, sk)}</svg>`;
}
function setTurnMark(el, p, star) {
  if (!p) { el.innerHTML = ""; return; }
  const sk = skinOf(p);
  el.innerHTML = pathsFor(p, 999, star, sk);
  el.setAttribute("class", `mark ${p === 1 ? "x" : "o"}${star ? " is-star" : ""}${skinClasses(sk)}`);
}

const boardEl = $("board"), mainEl = $("mainBoard");
const subEls = [], cellEls = [], slotEls = [], mcellEls = [], pCells = [], cCells = [];
function buildDOM() {
  let h = "";
  for (let b = 0; b < 9; b++) {
    h += `<div class="sub" data-b="${b}" role="rowgroup"><span class="sub-num">${b + 1}</span>`;
    for (let c = 0; c < 9; c++) { const i = b * 9 + c; h += `<button class="cell" type="button" data-i="${i}" id="cell-${i}"></button>`; }
    h += `<div class="overlay-slot"></div></div>`;
  }
  boardEl.innerHTML = h;
  boardEl.querySelectorAll(".sub").forEach((s, b) => { subEls[b] = s; slotEls[b] = s.querySelector(".overlay-slot"); });
  boardEl.querySelectorAll(".cell").forEach(el => { cellEls[+el.dataset.i] = el; });
  mainEl.innerHTML = Array.from({ length: 9 }, (_, i) => `<div class="mcell" data-i="${i}"><span class="n">${i + 1}</span></div>`).join("");
  mainEl.querySelectorAll(".mcell").forEach((m, i) => { mcellEls[i] = m; });
  const ttt = pre => Array.from({ length: 9 }, (_, i) => `<button class="tcell" type="button" data-i="${i}" id="${pre}-${i}"></button>`).join("");
  $("preludeGrid").innerHTML = ttt("pc") + gridSVG("g3", 31, [33.3, 66.7], 3, 97, 1.6);
  $("tttBoard").innerHTML = ttt("tc") + gridSVG("g3", 47, [33.3, 66.7], 3, 97, 1.6);
  boardEl.insertAdjacentHTML("beforeend", gridSVG("g9", 63, [33.2, 66.8], 0.6, 99.4, 0.9));
  mainEl.insertAdjacentHTML("beforeend", gridSVG("gm", 71, [33.3, 66.7], 4, 96, 2));
  for (let i = 0; i < 9; i++) { pCells[i] = $("pc-" + i); cCells[i] = $("tc-" + i); }

  $("faceO").innerHTML = markSVG(2, 778, "", false, DEF_SKIN);
}

function fetchFriends(force) {

  if (!force && Date.now() - friendsCache.at < 20000) return;
  friendsCache.busy = true;
  apiCall("/api/friends", {}).then(r => {
    const ok = Array.isArray(r.friends);
    friendsCache = { at: Date.now(), list: ok ? r.friends : friendsCache.list, busy: false, ok: ok || friendsCache.ok, refs: r.refs || friendsCache.refs };
    if (app.screen === "menu") renderCover(); else if (app.screen === "me") renderMe();
  }).catch(() => { friendsCache.busy = false; friendsCache.at = Date.now(); });
}

// menu navigation: a small stack, so "Back" always returns to where you came from
function openScreen(s) {
  if (!s || s === app.screen) return;
  if (s === "shop") { openShop(); return; }
  if (isMenuScreen(app.screen)) app.nav.push(app.screen);
  else app.nav = s === "menu" ? [] : ["menu"];
  if (s === "online") ogCache.at = 0;
  if (s === "me") fetchFriends(true);
  buildMenu();
  show(s);
}

function tgBack() {
  if (!TG || !TG.BackButton) return;
  try { if (app.screen === "menu" && !anySheet()) TG.BackButton.hide(); else TG.BackButton.show(); } catch (e) {}
}
function tgInit() {
  if (!TG) return;
  document.documentElement.classList.add("in-tg");
  try { TG.ready(); } catch (e) {}
  try { TG.expand(); } catch (e) {}
  const v = x => { try { return !!(TG.isVersionAtLeast && TG.isVersionAtLeast(x)); } catch (e) { return false; } };
  // full screen on phones: no Telegram header, it looks like a real game
  try { if (v("8.0") && ["android", "ios"].includes(TG.platform)) { TG.requestFullscreen(); if (TG.lockOrientation) TG.lockOrientation(); } } catch (e) {}
  try { if (v("7.7") && TG.disableVerticalSwipes) TG.disableVerticalSwipes(); } catch (e) {}
  try {
    if (v("8.0") && TG.checkHomeScreenStatus) {
      TG.checkHomeScreenStatus(st => { homeStatus = st || ""; try { renderSettings(); if (app.screen === "menu") renderCover(); } catch (e) {} });
      TG.onEvent("homeScreenAdded", () => { homeStatus = "added"; toast(t("homeAdded")); try { renderSettings(); renderCover(); } catch (e) {} });
    }
  } catch (e) {}   // a swipe down must not close the game mid-move
  try { if (TG.setHeaderColor) TG.setHeaderColor("#f6f7f2"); if (TG.setBackgroundColor) TG.setBackgroundColor("#f6f7f2"); } catch (e) {}
  try { if (v("7.0") && TG.SettingsButton) { TG.SettingsButton.show(); TG.SettingsButton.onClick(() => { if (inGame() || app.screen === "wait") goMenu(); openScreen("settings"); }); } } catch (e) {}
  try {
    TG.BackButton.onClick(() => {
      if (!$("rulesSheet").hidden) closeRules();
      else if (!$("onlineSheet").hidden) closeOnlineSheet();
      else if (!$("welcomeSheet").hidden) welcomeClose(false);
      else if (!$("installSheet").hidden) closeInstall();
      else if (inGame() || app.screen === "wait") goMenu();
      else if (app.screen !== "menu") goBack();
    });
  } catch (e) {}
  tgBack();
}
// from a game back to where it was started: the ladder, the online screen or the cover
function goMenu() {
  if (app.learn) endLearn();
  cancelBot();
  clearTimeout(slowTimer);
  if (app.online) stopOnline();
  document.body.classList.remove("is-bot");
  uiMode = null;
  const home = isMenuScreen(app.home) && app.home !== "shop" ? app.home : "menu";
  app.nav = home === "menu" ? [] : ["menu"];
  buildMenu();
  show(home);
}

async function checkUpdate() {
  toast(t("updating"));
  try {
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update();
    const r = await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" });
    const m = /const APP_VERSION = "([^"]+)"/.exec(await r.text());
    if (m && m[1] !== APP_VERSION) { setTimeout(() => location.reload(), 600); return; }
  } catch (e) {}

function itemCard(it, n) {

  const btn = on ? `<button class="btn small" type="button" disabled>${t("equipped")}</button>`
    : own ? `<button class="btn small" type="button" data-equip="${it.id}">${t("equip")}</button>`
    : `<button class="btn small ${it.cur === "coins" ? "gold-btn" : "primary"}" type="button" data-buy="${it.id}">${t("buy")} · ${it.price} ${curIcon(it.cur)}</button>`;
  return `<div class="item${on ? " on" : ""}${it.premium ? " premium" : ""}${justBought === it.id ? " just-bought" : ""}">
    <div class="item-prev">${markSVG(pv.sym, 41 + n, justBought === it.id ? "fresh" : "", false, pv.sk)}</div>
    <div class="item-name">${itemName(it.id)}</div>
    <div class="item-price">${it.price === 0 ? t("free") : own ? t("owned") : it.premium ? t("beatNet") : ""}</div>
    ${btn}</div>`;
}
function renderShop() {
  $("shopWallet").innerHTML = walletHTML();
  const sec = (title, list, note) => `<section class="shop-sec"><h3>${title}</h3>${note ? `<p class="shop-hint">${note}</p>` : ""}<div class="items">${list.map((it, n) => itemCard(it, n)).join("")}</div></section>`;
  const by = (kind, prem) => SHOP.filter(s => s.kind === kind && !!s.premium === prem);
  const base = PACKS[0].coins / PACKS[0].stars;
  const packs = TG && serverOn() ? PACKS.map((p, k) => {
    const bonus = Math.round((p.coins / p.stars / base - 1) * 100);
    return `<div class="item pack"><div class="item-prev coin-prev">${ICON_COIN}</div><div class="item-name">${p.coins} ${t("coinsWord", p.coins)}</div><div class="item-price">${bonus > 0 ? t("bonusLabel", bonus) : ""}</div><button class="btn small gold-btn" type="button" data-pack="${k}"${shopBusy ? " disabled" : ""}>${p.stars} ⭐</button></div>`;
  }).join("") : "";
  const coinSec = TG && serverOn()
    ? `<section class="shop-sec"><h3>${t("secCoins")}</h3><p class="shop-hint">${t("coinsStars")}</p><div class="items">${packs}</div></section>`
    : `<section class="shop-sec"><h3>${t("secCoins")}</h3><p class="shop-hint">${serverOn() ? t("coinsBot") : t("coinsTg")}</p>${TG ? "" : `<button class="btn small gold-btn" type="button" data-open-tg="1">${t("openTg")}</button>`}</section>`;
  const exch = EXCHANGE.map(([c, n], k) => {
    const bonus = Math.round((n / (c * 20) - 1) * 100);
    return `<div class="item pack"><div class="item-prev ex-prev">${ICON_COIN}<span class="ex-arrow">→</span>${ICON_CLIP}</div>
      <div class="item-name">${n} ${t("clipsWord", n)}</div><div class="item-price">${bonus > 0 ? t("bonusLabel", bonus) : ""}</div>
      <button class="btn small gold-btn" type="button" data-exchange="${k}">${t("exchangeBtn")} · ${c} ${ICON_COIN}</button></div>`;
  }).join("");
  $("shopBody").innerHTML =
    `<p class="shop-hint earn">${t("earnHint")}</p>` +
    (shopNote ? `<p class="shop-note ${shopNote[1]}">${shopNote[0]}</p>` : "") +
    sec(t("secPremium"), SHOP.filter(s => s.premium), t("premiumHint")) +
    sec(t("secXShape"), by("xShape", false)) +
    sec(t("secOShape"), by("oShape", false)) +
    sec(t("secXColor"), by("xColor", false)) +
    sec(t("secOColor"), by("oColor", false)) +
    `<section class="shop-sec"><h3>${t("secExchange")}</h3><p class="shop-hint">${t("exchangeHint")}</p><div class="items">${exch}</div></section>` +
    coinSec;
  justBought = null;
}
function shopNoteSet(text, kind) { shopNote = [text, kind]; renderShop(); }
async function serverSpend(item) {
  shopBusy = true;
  try { return await apiCall("/api/spend", { item }); }
  catch (e) { return { error: "net" }; }
  finally { shopBusy = false; }
}
function waitForCoins(before, added, tries) {
  syncProfile().then(() => {
    if (profile.coins >= before + added) { hapticResult(true); SND.play("win"); shopNoteSet(t("paid", added), "ok"); }
    else if (tries > 0) setTimeout(() => waitForCoins(before, added, tries - 1), 1500);
    else shopNoteSet(t("paidLater"), "warn");
  });
}
async function buyPack(k) {
  const p = PACKS[k];
  if (!p || shopBusy) return;
  shopBusy = true; shopNoteSet(t("wait"), "ok");
  let res;
  try { res = await apiCall("/api/invoice", { pack: k }); } catch (e) { res = { error: "net" }; }
  shopBusy = false;
  if (!res.link) { shopNoteSet(t("netError"), "warn"); return; }
  shopNote = null; renderShop();
  const before = profile.coins;
  try {
    TG.openInvoice(res.link, status => {
      if (status === "paid") { shopNoteSet(t("wait"), "ok"); waitForCoins(before, p.coins, 8); }
      else if (status === "failed") shopNoteSet(t("payFailed"), "warn");
    });
  } catch (e) { shopNoteSet(t("payFailed"), "warn"); }
}
async function shopAction(ev) {
  const b = ev.target.closest("button");
  if (!b || shopBusy) return;
  if (b.dataset.buy) {
    const it = itemOf(b.dataset.buy);
    if (!it || owns(it.id)) return;
    const have = profile[it.cur];
    if (have < it.price) { shopNoteSet(it.cur === "clips" ? t("notEnoughClips", it.price - have) : t("notEnoughCoins", it.price - have), "warn"); return; }
    if (serverOn()) {
      const w = await serverSpend(it.id);
      const short = w.error === "coins" || w.error === "clips";
      if (w.error === "net" || (!w.ok && !short)) { shopNoteSet(t("netError"), "warn"); return; }
      applyProfile(w);
      if (!w.ok) { const h = profile[it.cur]; shopNoteSet(it.cur === "clips" ? t("notEnoughClips", it.price - h) : t("notEnoughCoins", it.price - h), "warn"); return; }
    } else profile[it.cur] -= it.price;
    if (!profile.owned.includes(it.id)) profile.owned.push(it.id);
    profile.equip[it.kind] = it.id;
    skinRev++; saveProfile();
    shopNote = it.premium ? [t("buyQuote"), "quote"] : [t("bought", itemName(it.id)), "ok"]; justBought = it.id;
    SND.play("coin");
    renderShop();
  } else if (b.dataset.equip) {
    const it = itemOf(b.dataset.equip);
    if (!it || !owns(it.id)) return;
    profile.equip[it.kind] = it.id; skinRev++; saveProfile();
    if (serverOn()) apiCall("/api/equip", { id: it.id }).then(applyProfile).catch(() => {});
    shopNote = null; renderShop();
  } else if (b.dataset.exchange) {
    const k = +b.dataset.exchange, [c, n] = EXCHANGE[k];
    if (profile.coins < c) { shopNoteSet(t("notEnoughCoins", c - profile.coins), "warn"); return; }
    if (serverOn()) {
      const w = await serverSpend("ex" + k);
      if (w.error === "net" || (!w.ok && w.error !== "coins")) { shopNoteSet(t("netError"), "warn"); return; }
      applyProfile(w);
      if (!w.ok) { shopNoteSet(t("notEnoughCoins", c - profile.coins), "warn"); return; }
    } else { profile.coins -= c; profile.clips += n; saveProfile(); }
    SND.play("coin");
    shopNoteSet(t("exchanged", c, n), "ok");
  } else if (b.dataset.pack) {
    if (TG && serverOn()) buyPack(+b.dataset.pack);
  } else if (b.dataset.openTg) {
    try { window.open(BOT_LINK, "_blank"); } catch (e) {}
  }
}

// ---------------- rules sheet ----------------
let lastFocus = null;
function openRules() {
  lastFocus = document.activeElement;
  $("rulesSheet").hidden = false;
  tgBack();
  setTimeout(() => { try { $("rulesClose").focus(); } catch (e) {} }, 30);
}
function closeRules() {
  $("rulesSheet").hidden = true;
  tgBack();
  if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch (e) {}
}

// ---------------- events ----------------
function bind() {
  document.addEventListener("pointerdown", () => SND.unlock(), { once: true, capture: true });
  document.addEventListener("click", ev => {
    const act = ev.target.closest("[data-act]");
    if (!act) return;
    const a = act.dataset.act;
    if (a === "menu") goMenu();
    else if (a === "back") goBack();
    else if (a === "settings") openScreen("settings");
    else if (a === "learn") startLearn();
    else if (a === "learnNext") learnResolve("next");
    else if (a === "learnExit") goMenu();
    else if (a === "learnPlay") startGame("x02", "x1");
    else if (a === "invite") shareGameInvite();
    else if (a === "support") openSupport();
    else if (a === "update") checkUpdate();
    else if (a === "welcomeLearn") welcomeClose(true);
    else if (a === "welcomeLater") welcomeClose(false);
    else if (a === "shareCard") shareCard(false);
    else if (a === "shareStory") shareCard(true);
    else if (a === "install") doInstall();
    else if (a === "closeInstall") closeInstall();
    else if (a === "copyGame") { try { navigator.clipboard.writeText(GAME_URL); toast(t("copied")); } catch (e) {} }
    else if (a === "rules") openRules();
    else if (a === "again") { if (app.online) onlineRematch(); else startGame(app.mode, app.bot ? app.bot.id : ""); }
    else if (a === "resign") onlineResign();
    else if (a === "chat") togglePhrases();
    else if (a === "share") shareInvite();
    else if (a === "copy") copyInvite();
    else if (a === "cancelGame") cancelOnline();
    else if (a === "closeOnline") closeOnlineSheet();
    else if (a === "createOnline") createOnline();
    else if (a === "loginTop") { closeOnlineSheet(); openScreen("settings"); setTimeout(showLoginWidget, 50); }
    else if (a === "undo") undo();
    else if (a === "shop") openShop();
    else if (a === "login") showLoginWidget();
    else if (a === "logout") logout();
  });
  // menu: screens, opponents, the cover banner
  document.addEventListener("click", ev => {
    const go = ev.target.closest("[data-go]");
    if (go) { openScreen(go.dataset.go); return; }
    const on = ev.target.closest("[data-online]");
    if (on) { openOnlineSheet(on.dataset.online); return; }
    const o = ev.target.closest(".opp[data-mode]");
    if (o) { homeHere(); startGame(o.dataset.mode, o.dataset.bot); return; }
    const bn = ev.target.closest("#coverBanner");
    if (bn) {
      const act = bn.dataset.bn || "";
      if (act === "learn") startLearn();
      else if (act === "invite") shareGameInvite();
      else if (act === "login") { openScreen("settings"); setTimeout(showLoginWidget, 50); }
      else if (act === "resume") resumeGame();
      else if (act === "install") doInstall();
      else if (act.startsWith("og:")) { homeHere(); joinOnline(act.slice(3)); }
    }
  });
  document.querySelectorAll(".seg[data-side]").forEach(b => b.addEventListener("click", () => {
    app.side = +b.dataset.side;
    store.set("side", app.side);
    renderSettings();
  }));
  document.querySelectorAll(".seg[data-lang]").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
  $("rulesClose").addEventListener("click", closeRules);
  $("onlineSheet").addEventListener("click", ev => {
    if (ev.target === $("onlineSheet")) { closeOnlineSheet(); return; }
    const m = ev.target.closest("[data-min]");
    if (m) { onlineMinutes = +m.dataset.min; store.set("minutes", onlineMinutes); renderOnlineSheet(); }
  });
  document.addEventListener("click", ev => {
    const tk = ev.target.closest("[data-talk]");
    if (tk) { store.set("botTalk", tk.dataset.talk === "1"); renderSettings(); }
    const sd = ev.target.closest("[data-sound]");
    if (sd) { if ((sd.dataset.sound === "1") !== SND.on) SND.toggle(); renderSettings(); }
    const hp = ev.target.closest("[data-haptics]");
    if (hp) { store.set("haptics", hp.dataset.haptics === "1"); renderSettings(); haptic("light"); }
    const ph = ev.target.closest("[data-phrase]");
    if (ph) sayPhrase(+ph.dataset.phrase);
    const fp = ev.target.closest("[data-fplay]");
    if (fp) playFriend(fp.dataset.fplay, fp.dataset.fname);
    const og = ev.target.closest("[data-og]");
    if (og) { homeHere(); joinOnline(og.dataset.og); }
  });
  document.addEventListener("error", ev => {      // a friend's photo failed to load: show the first letter instead
    const img = ev.target;
    if (img && img.tagName === "IMG" && img.parentElement && img.parentElement.classList.contains("mini-ava")) {
      const sp = document.createElement("span"); sp.textContent = img.dataset.i || "?"; img.replaceWith(sp);
    }
  }, true);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && app.online) pollOnline(); });
  $("shopBody").addEventListener("click", shopAction);
  $("rulesSheet").addEventListener("click", ev => { if (ev.target === $("rulesSheet")) closeRules(); });
  document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !$("rulesSheet").hidden) closeRules(); });
  $("welcomeSheet").addEventListener("click", ev => { if (ev.target === $("welcomeSheet")) welcomeClose(false); });
  $("installSheet").addEventListener("click", ev => { if (ev.target === $("installSheet")) closeInstall(); });

  boardEl.addEventListener("click", async ev => {
    const btn = ev.target.closest(".cell");
    if (!btn || inputBusy) return;
    const e = cur();
    if (!e || e.phase !== "main") return;
    const g = e.g;
    if (g.result || isBot(g.turn)) return;
    const i = +btn.dataset.i, b = (i / 9) | 0;
    const a = g.choosing ? 300 + b : uiMode === "strike" ? 200 + i : uiMode === "star" ? 100 + i : i;
    if (app.learn && !learnAllows(a)) { flash = t("learnTap"); renderX02(null); flash = null; return; }
    if (!E.isLegal(g, a)) {
      const al = E.allowed(g);
      flash = g.choosing ? t("fNoFree")
        : uiMode === "strike" ? t("fStrikeOnly")
        : g.cells[i] ? t("fOccupied")
        : al.length === 1 ? t("fOnlyBoard", al[0] + 1) : t("fCannot");
      renderX02(null);
      flash = null;
      return;
    }
    if (app.online) { onlineMove(a); return; }
    inputBusy = true;
    haptic("light");
    try { await doMain(a); } finally { inputBusy = false; }
    if (app.learn) { learnResolve("move", a); return; }
    kickBot();
  });
  $("preludeGrid").addEventListener("click", ev => {
    const btn = ev.target.closest(".tcell");
    const e = cur();
    if (!btn || !e || e.phase !== "prelude" || e.t.result || isBot(e.t.turn)) return;
    if (app.online) { onlineMove(+btn.dataset.i); return; }
    if (app.learn) { if (learnAllows(+btn.dataset.i) && doPrelude(+btn.dataset.i)) { haptic("light"); learnResolve("move", +btn.dataset.i); } return; }
    if (doPrelude(+btn.dataset.i)) { haptic("light"); kickBot(); }
  });
  $("tttBoard").addEventListener("click", ev => {
    const btn = ev.target.closest(".tcell");
    const e = cur();
    if (!btn || !e || e.t.result || isBot(e.t.turn)) return;
    if (app.online) { onlineMove(+btn.dataset.i); return; }
    if (doClassic(+btn.dataset.i)) { haptic("light"); kickBot(); }
  });
  $("starBtn").addEventListener("click", () => {
    if (app.learn) { if (app.learn.btn === "star") { uiMode = "star"; renderX02(null); learnResolve("move", "star"); } return; }
    uiMode = uiMode === "star" ? null : "star"; renderX02(null);
  });
  $("strikeBtn").addEventListener("click", () => {
    if (app.learn) { if (app.learn.btn === "strike") { uiMode = "strike"; renderX02(null); learnResolve("move", "strike"); } return; }
    uiMode = uiMode === "strike" ? null : "strike"; renderX02(null);
  });
  $("preludeStart").addEventListener("click", startMainFromPrelude);
  $("coinStart").addEventListener("click", startMainFromPrelude);
  $("preludeSkip").addEventListener("click", () => {
    cancelBot();
    app.history.push({ phase: "main", g: E.newMain(1) });
    renderX02(null);
    kickBot();
  });
  $("coinBtn").addEventListener("click", () => {
    const e = cur();
    if (!e || e.phase !== "prelude" || e.t.result !== 3 || e.coin || flipping) return;
    $("coinBtn").disabled = true;
    $("coinText").textContent = "…";
    $("coin").classList.remove("golden");
    flipCoin((r, golden) => {
      const c = cur();
      app.history.push(Object.assign({}, c, { coin: r, golden: golden ? 1 : 0 }));
      renderX02(null);
    });
  });
}

// ---------------- boot ----------------
function snapshot() {
  if (app.online || app.learn) return {};
  return { screen: app.screen, mode: app.mode, botId: app.bot ? app.bot.id : "", side: app.side, history: app.history, gameId: app.gameId };
}
function boot(data) {
  tgInit();
  const gid = gameFromLink(), cid = gid ? "" : challengeFromLink();
  app.linkVisit = !!(gid || cid);
  handleLoginReturn().then(syncProfile).then(() => { if (gid) joinOnline(gid); else if (cid) joinChallenge(cid); else maybeWelcome(); });
  buildDOM();
  applyStatic();
  buildMenu();
  bind();
  const ok = data && data.mode && (data.screen === "x02" || data.screen === "classic") && Array.isArray(data.history) && data.history.length
    && (data.mode === "classic" ? !!data.history[0].t : !!data.history[0].phase);
  if (ok) {
    app.mode = data.mode;
    app.bot = data.botId ? BOTS[data.mode].find(b => b.id === data.botId) || null : null;
    app.side = data.side === 2 ? 2 : 1;
    app.history = data.history;
    app.gameId = data.gameId || 1;
    show(data.screen);
    render(null);
    kickBot();
  } else show("menu");
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(snapshot); } catch (e) {}
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();

</script>
<script>

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
// "Установить" button where the browser offers installation (Chrome, Edge, Android)
(function () {
  let deferred = null;
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    deferred = e;
    const foot = document.querySelector(".menu-foot");
    if (!foot || document.getElementById("installBtn")) return;
    const b = document.createElement("button");
    b.id = "installBtn"; b.type = "button"; b.className = "btn primary"; b.textContent = "Установить приложение";
    b.addEventListener("click", async () => { if (!deferred) return; deferred.prompt(); try { await deferred.userChoice; } catch (err) {} deferred = null; b.remove(); });
    foot.prepend(b);
  });
  window.addEventListener("appinstalled", () => { const b = document.getElementById("installBtn"); if (b) b.remove(); });
})();

</script>
