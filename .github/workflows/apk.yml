name: Android APK
on:
  push:
    paths: ["android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk X02.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: X02.0 для Android
          body: "Скачай X02.apk ниже и открой его на телефоне. Обновляется само при каждом выпуске."
          files: X02.apk
          make_latest: true
